<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Duology Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--v-bg:#14131A;--v-panel:#1F1D29;--v-ink:#EEEAF2;--v-muted:#B3ADBF;--v-line:#3A3647;--v-accent:#A9B6FF;--v-accent-soft:#2E3462;--v-brass:#E4A673;
  --ui-bg:#0F0E14;--ui-panel:#1A1822;--ui-line:#2F2C3B;--ui-ink:#EEEAF2;--ui-muted:#A9A3B5;--ok:#7FD1A0;--warn:#F0B35B;
  --serif:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--v-accent);outline-offset:2px}
.s-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 24px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel)}
.s-brand{font-family:var(--serif);font-size:24px;font-weight:600}.s-brand em{color:var(--v-accent)}.s-brand span{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--v-brass);margin-left:6px}
.s-month{display:flex;align-items:center;gap:10px;font-size:17px}
.s-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ui-muted)}
.s-field select,.s-field input{background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:6px 8px;color:var(--ui-ink)}
.s-field input{width:72px}
.s-dur{padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px}
.s-dur.ok{background:rgba(127,209,160,.15);color:var(--ok)}.s-dur.warn{background:rgba(240,179,91,.15);color:var(--warn)}
.s-tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel)}
.s-tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 16px;font-weight:600;color:var(--ui-muted)}
.s-tabs button[aria-current="page"]{color:var(--ui-ink);border-color:var(--v-accent)}
.s-pad{padding:20px 24px 60px;max-width:1500px;margin:0 auto}
.s-pad h2{font-family:var(--serif);font-weight:600;margin:24px 0 10px}
.s-btn{width:40px;height:40px;border-radius:20px;border:1px solid var(--ui-line);background:var(--ui-bg);font-size:20px;line-height:1}
.s-btn2{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-bg);font-weight:600;font-size:14px}
.s-cta{min-height:40px;padding:0 18px;border-radius:10px;border:none;background:var(--v-accent);color:#14131A;font-weight:700}
.s-link{background:none;border:none;color:var(--v-accent);font-weight:600;font-size:13px;padding:4px 6px;text-decoration:underline}
.s-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.s-hint{color:var(--ui-muted);font-size:13px}
.s-sec{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.s-sechead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.s-meta{color:var(--ui-muted);font-size:13px}
.s-edited{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--v-brass);border:1px solid var(--v-brass);border-radius:10px;padding:1px 8px}
.s-sec textarea{width:100%;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.55;resize:vertical}
#ytdesc{width:100%;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:10px;padding:12px;font-size:14px;line-height:1.5}
.s-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:10px;margin-bottom:8px}.s-row span:first-child{flex:1;font-weight:600}
.s-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.s-timeline{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ui-panel);margin-bottom:12px;gap:2px}
.s-timeline button{border:none;padding:0;background:var(--ui-line);height:100%}.s-timeline button.on{background:var(--v-accent)}
.s-stage{position:relative;width:100%;overflow:hidden;background:var(--v-bg);border-radius:12px;border:1px solid var(--ui-line)}
.s-canvas{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--v-bg)}
.s-voice{margin-top:14px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;padding:12px 16px}.s-voice p{margin:6px 0 0;color:var(--ui-muted)}
.s-signs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.s-signs button{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--ui-line);background:var(--ui-panel);font-weight:600;font-size:13px}
.s-signs button[aria-pressed="true"]{background:var(--v-accent);color:#14131A;border-color:var(--v-accent)}
.s-shortwrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}.s-shortside{flex:1;min-width:320px}
body.clean{overflow:hidden;cursor:none}
body.clean .s-voicepanel,body.clean .s-top,body.clean .s-tabs,body.clean .s-controls,body.clean .s-timeline,body.clean .s-voice,body.clean .s-hint,body.clean .s-signs,body.clean .s-shortside{display:none}
body.clean .s-pad{padding:0;max-width:none}
body.clean .s-stage{position:fixed;inset:0;width:100vw !important;height:100vh !important;border:none;border-radius:0;z-index:50;background:#000}
/* ----- voice + record ----- */
.s-voicepanel{margin-top:14px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;padding:14px 16px}
.s-vhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.s-file{position:relative;display:inline-flex;align-items:center;cursor:pointer}.s-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.s-rec{min-height:40px;padding:0 18px;border-radius:10px;border:none;background:#E5484D;color:#fff;font-weight:700}
.s-vrow{display:flex;gap:12px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ui-line);font-size:13px}
.s-vn{color:var(--ui-ink)}.s-vok{color:var(--ok)}.s-vmiss{color:var(--ui-muted)}
.s-vwarn{color:var(--warn);font-size:13px;margin:4px 0}
.s-vlist summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--v-accent);margin:6px 0}
.s-recmsg{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(127,209,160,.12);color:var(--ok);font-weight:600;font-size:14px}
.s-fname{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--v-brass);background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:6px;padding:2px 8px}
/* music + sting */
.s-music{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--ui-line)}
.s-music input[type=range]{width:140px;accent-color:#A9B6FF}
.v-sting{gap:26px}
.st-ring{stroke-dasharray:1194;stroke-dashoffset:1194;transform-origin:210px 210px;transform:rotate(-90deg);animation:stdraw 1.1s cubic-bezier(.4,0,.2,1) forwards}
.st-tick{opacity:0;animation:stfade .35s ease .95s forwards}
.st-du{opacity:0;animation:stfade .5s ease .45s forwards}
.st-word{opacity:0;transform:translateY(16px);animation:stpop .7s cubic-bezier(.2,.7,.2,1) 1.1s forwards}
.st-tag{opacity:0;animation:stfade .6s ease 1.5s forwards}
@keyframes stdraw{to{stroke-dashoffset:0}}@keyframes stfade{to{opacity:1}}@keyframes stpop{to{opacity:1;transform:none}}
/* ----- video scenes ----- */
.v{position:absolute;inset:0;padding:90px 110px;color:var(--v-ink);font-family:var(--sans);background:var(--v-bg)}
.v::after{content:"";position:absolute;inset:36px;border:2px solid var(--v-line);border-radius:28px;pointer-events:none}
.v-title{display:flex;flex-direction:column;justify-content:center;padding-left:160px}
.v-kicker{font-size:34px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--v-brass)}
.v-huge{font-family:var(--serif);font-size:300px;font-weight:600;line-height:1;letter-spacing:-6px}
.v-year{font-size:52px;color:var(--v-muted);margin-top:10px}
.v-glyphrow{display:flex;gap:44px;font-size:60px;color:var(--v-accent);margin-top:60px}
.v-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.v-brand{font-family:var(--serif);font-weight:600;line-height:1}.v-brand em{font-style:italic;font-weight:500;color:var(--v-accent)}
.v-sub{font-size:52px;color:var(--v-muted)}
.v-pills{display:flex;gap:22px}.v-pills span{font-size:34px;border:2px solid var(--v-line);border-radius:40px;padding:12px 30px}
.v-note{font-size:30px;color:var(--v-muted)}
.v-sky,.v-sign{display:grid;grid-template-columns:600px 1fr;gap:80px;align-items:start;padding-top:100px}
.v-left{display:flex;flex-direction:column;align-items:center}
.v-right{display:flex;flex-direction:column;gap:22px}
.v-date{font-family:var(--serif);font-size:150px;font-weight:600;line-height:.95;text-align:center}.v-date span{display:block;font-family:var(--sans);font-size:44px;letter-spacing:8px;color:var(--v-brass);font-weight:700}
.v-wheel{margin-top:20px}
.v-h1{font-family:var(--serif);font-size:80px;font-weight:600;line-height:1.05}
.v-block{font-size:30px;line-height:1.4;color:var(--v-ink)}.v-block b{display:block;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:var(--v-brass);margin-bottom:4px}
.v-fact{margin-top:22px;font-size:23px;line-height:1.4;background:var(--v-panel);border:2px solid var(--v-line);border-radius:18px;padding:16px 22px;color:var(--v-muted);text-align:left}.v-fact b{color:var(--v-accent)}
.v-bignum{font-family:var(--serif);font-size:340px;font-weight:600;line-height:.9;color:var(--v-accent)}
.v-work{font-size:34px;color:var(--v-muted);font-variant-numeric:tabular-nums;background:var(--v-panel);border-radius:18px;padding:18px 30px}
.v-signglyph{font-size:200px;line-height:1;color:var(--v-accent)}
.v-ev{display:flex;gap:28px;align-items:flex-start;background:var(--v-panel);border:2px solid var(--v-line);border-radius:22px;padding:20px 28px}
.v-evd{font-family:var(--serif);font-size:72px;font-weight:600;line-height:.95;min-width:110px;text-align:center}.v-evd span{display:block;font-family:var(--sans);font-size:24px;letter-spacing:4px;color:var(--v-brass);font-weight:700}
.v-ev b{font-size:36px;display:block;line-height:1.2}.v-ev div div{font-size:27px;color:var(--v-muted);line-height:1.35;margin-top:4px}
.v-recharge{font-size:32px;color:var(--v-muted)}.v-recharge b{color:var(--v-brass);margin-right:10px}
.v-url{font-size:40px;color:var(--v-accent);font-weight:700;letter-spacing:1px}
.v-tall{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:140px 90px}
.v-tall .v-kicker{font-size:48px}
.v-ev-tall{width:100%;flex-direction:column;gap:14px;padding:40px}.v-ev-tall .v-evd{font-size:110px;text-align:left}.v-ev-tall .v-evd span{font-size:36px}.v-ev-tall b{font-size:58px}.v-ev-tall div div{font-size:42px}
.v-calc{font-family:var(--serif);font-size:84px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--v-ink);line-height:1.15}.v-calc.big{font-size:104px;color:var(--v-accent)}
.v-numrow{display:flex;align-items:center;gap:36px;width:100%;background:var(--v-panel);border:2px solid var(--v-line);border-radius:24px;padding:18px 36px}.v-numrow b{font-family:var(--serif);font-size:84px;color:var(--v-accent);min-width:60px;text-align:center;line-height:1}.v-numrow span{font-size:50px}
.a1,.a2,.a3,.a4,.a5,.a6{opacity:0;animation:vin .8s cubic-bezier(.2,.7,.2,1) forwards}
.a1{animation-delay:.1s}.a2{animation-delay:.4s}.a3{animation-delay:.8s}.a4{animation-delay:1.2s}.a5{animation-delay:1.6s}.a6{animation-delay:2s}
@keyframes vin{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.v-calc{font-family:var(--serif);font-size:84px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--v-ink);line-height:1.15}.v-calc.big{font-size:104px;color:var(--v-accent)}
.v-numrow{display:flex;align-items:center;gap:36px;width:100%;background:var(--v-panel);border:2px solid var(--v-line);border-radius:24px;padding:18px 36px}.v-numrow b{font-family:var(--serif);font-size:84px;color:var(--v-accent);min-width:60px;text-align:center;line-height:1}.v-numrow span{font-size:50px}
.a1,.a2,.a3,.a4,.a5,.a6{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="studio"></div>
<script>
// ===== ENGINE START =====
// Astronomy engine: no dependencies. Accuracy is roughly 1-2 arcminutes for the
// planets (JPL approximate Keplerian elements, valid 1800-2050) and a few
// arcminutes for the Moon (truncated Meeus series). Plenty for sign/house/aspect work.
var Astro = (function () {
  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  function norm(x) { x = x % 360; return x < 0 ? x + 360 : x; }
  function sind(x) { return Math.sin(x * D2R); }
  function cosd(x) { return Math.cos(x * D2R); }
  function tand(x) { return Math.tan(x * D2R); }
  function atan2d(y, x) { return Math.atan2(y, x) * R2D; }
  function asind(x) { return Math.asin(Math.max(-1, Math.min(1, x))) * R2D; }

  function jdFromMs(ms) { return ms / 86400000 + 2440587.5; }
  function msFromJd(jd) { return (jd - 2440587.5) * 86400000; }

  // [a, e, I, L, longPeri, longNode] and their rates per Julian century
  var EL = {
    mercury: [0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593, 0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081],
    venus: [0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255, 0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418],
    earth: [1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0, 0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0],
    mars: [1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891, 0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343],
    jupiter: [5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909, -0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106],
    saturn: [9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448, -0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794],
    uranus: [19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503, -0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589],
    neptune: [30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574, 0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664],
    pluto: [39.48211675, 0.24882730, 17.14001206, 238.92903833, 224.06891629, 110.30393684, -0.00031596, 0.00005170, 0.00004818, 145.20780515, -0.04062942, -0.01183482]
  };

  function helio(name, T) {
    var p = EL[name];
    var a = p[0] + p[6] * T, e = p[1] + p[7] * T, I = p[2] + p[8] * T;
    var L = p[3] + p[9] * T, wbar = p[4] + p[10] * T, O = p[5] + p[11] * T;
    var M = norm(L - wbar), w = wbar - O;
    var Mr = M * D2R, E = Mr + e * Math.sin(Mr);
    for (var i = 0; i < 12; i++) E = E - (E - e * Math.sin(E) - Mr) / (1 - e * Math.cos(E));
    var xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
    var cw = cosd(w), sw = sind(w), cO = cosd(O), sO = sind(O), cI = cosd(I), sI = sind(I);
    return {
      x: (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp,
      y: (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp,
      z: (sw * sI) * xp + (cw * sI) * yp
    };
  }

  function precession(T) { return (5028.796195 * T + 1.1054348 * T * T) / 3600; }

  function moonLon(T) {
    var Lp = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T;
    var D = 297.8501921 + 445267.1114034 * T - 0.0018819 * T * T;
    var M = 357.5291092 + 35999.0502909 * T - 0.0001536 * T * T;
    var Mp = 134.9633964 + 477198.8675055 * T + 0.0087414 * T * T;
    var F = 93.2720950 + 483202.0175233 * T - 0.0036539 * T * T;
    var E = 1 - 0.002516 * T;
    var terms = [
      [0, 0, 1, 0, 6288774], [2, 0, -1, 0, 1274027], [2, 0, 0, 0, 658314], [0, 0, 2, 0, 213618],
      [0, 1, 0, 0, -185116], [0, 0, 0, 2, -114332], [2, 0, -2, 0, 58793], [2, -1, -1, 0, 57066],
      [2, 0, 1, 0, 53322], [2, -1, 0, 0, 45758], [0, 1, -1, 0, -40923], [1, 0, 0, 0, -34720],
      [0, 1, 1, 0, -30383], [2, 0, 0, -2, 15327], [0, 0, 1, 2, -12528], [0, 0, 1, -2, 10980],
      [4, 0, -1, 0, 10675], [0, 0, 3, 0, 10034], [4, 0, -2, 0, 8548], [2, 1, -1, 0, -7888],
      [2, 1, 0, 0, -6766], [1, 0, -1, 0, -5163], [1, 1, 0, 0, 4987], [2, -1, 1, 0, 4036],
      [2, 0, 2, 0, 3994], [4, 0, 0, 0, 3861], [2, 0, -3, 0, 3665], [0, 1, -2, 0, -2689],
      [2, 0, -1, 2, -2602], [2, -1, -2, 0, 2390], [1, 0, 1, 0, -2348], [2, -2, 0, 0, 2236],
      [0, 1, 2, 0, -2120], [0, 2, 0, 0, -2069], [2, -2, -1, 0, 2048], [2, 0, 1, -2, -1773],
      [2, 0, 0, 2, -1595], [4, -1, -1, 0, 1215], [0, 0, 2, 2, -1110], [3, 0, -1, 0, -892],
      [2, 1, 1, 0, -810], [4, -1, -2, 0, 759], [0, 2, -1, 0, -713], [2, 2, -1, 0, -700],
      [2, 1, -2, 0, 691], [2, -1, 0, -2, 596], [4, 0, 1, 0, 549], [0, 0, 4, 0, 537],
      [4, -1, 0, 0, 520], [1, 0, -2, 0, -487]
    ];
    var s = 0;
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i], arg = t[0] * D + t[1] * M + t[2] * Mp + t[3] * F;
      var c = t[4];
      if (Math.abs(t[1]) === 1) c *= E; else if (Math.abs(t[1]) === 2) c *= E * E;
      s += c * sind(arg);
    }
    var A1 = 119.75 + 131.849 * T, A2 = 53.09 + 479264.290 * T;
    s += 3958 * sind(A1) + 1962 * sind(Lp - F) + 318 * sind(A2);
    return norm(Lp + s / 1e6);
  }

  function meanNode(T) { return norm(125.04452 - 1934.136261 * T + 0.0020708 * T * T); }
  function obliquity(T) { return 23.439291 - 0.0130042 * T; }

    if (i === 1) return '<div class="v v-tall"><div class="a1 v-kicker">Quick check</div><div class="a2">' + line('Birth day + month → 1 digit') + '</div><div class="a3">' + line('+ ' + c.yR.n + ' for ' + c.y) + '</div><div class="a4">' + line('+ ' + c.mR.n + ' for ' + Mon) + '</div><div class="a5">' + line('Reduce to 1 digit', true) + '</div></div>';
    if (i === 2) return '<div class="v v-tall"><div class="a1 v-bignum" style="font-size:300px">' + n + '</div><div class="a2 v-h1" style="font-size:96px;text-align:center">' + T.title + '</div><div class="a3 v-ev v-ev-tall"><div><b>At its best</b><div>' + D.good + '</div></div></div><div class="a4 v-ev v-ev-tall"><div><b>Watch out for</b><div>' + D.watch + '</div></div></div></div>';
    return '<div class="v v-tall"><div class="a1 v-h1" style="font-size:110px;text-align:center">Sound like<br>your month?</div><div class="a2 v-sub" style="font-size:56px">Tell me in the comments</div><div class="a3" style="margin-top:60px">' + wordmark(140) + '</div><div class="a4 v-url" style="font-size:48px">Link in bio</div></div>';
  }

  // ---------- views ----------
  function header(secs) {
    var tot = secs.reduce(function (a, s) { return a + secDur(s); }, 0), words = secs.reduce(function (a, s) { return a + wordCount(s.text); }, 0);
    var inBand = tot >= 300 && tot <= 435;
    return '<header class="s-top"><div class="s-brand">Du<em>ology</em> <span>Studio</span></div>' +
      '<div class="s-month"><button class="s-btn" data-act="mprev" aria-label="Previous month">‹</button><b>' + sky().label + '</b><button class="s-btn" data-act="mnext" aria-label="Next month">›</button></div>' +
      '<label class="s-field">Depth <select id="depth"><option value="tight"' + (st.depth === 'tight' ? ' selected' : '') + '>Tight (~6 min)</option><option value="standard"' + (st.depth === 'standard' ? ' selected' : '') + '>Standard (~7 min)</option><option value="deep"' + (st.depth === 'deep' ? ' selected' : '') + '>Deep (10+ min)</option></select></label>' +
      '<label class="s-field">Open with <select id="order"><option value="hook"' + (st.order !== 'greet' ? ' selected' : '') + '>Hook, then greeting</option><option value="greet"' + (st.order === 'greet' ? ' selected' : '') + '>Greeting first</option></select></label>' +
      '<label class="s-field">Voice pace <input id="wpm" type="number" min="120" max="200" step="5" value="' + st.wpm + '"> wpm</label>' +
      '<div class="s-dur ' + (inBand ? 'ok' : 'warn') + '" id="durbadge">' + fmtDur(tot) + ' · ' + words + ' words' + (inBand ? '' : (tot < 300 ? ' · under 5 min' : ' · over 7 min')) + '</div></header>' +
      '<nav class="s-tabs">' + [['script', 'Script'], ['video', 'Video'], ['shorts', 'Shorts'], ['youtube', 'YouTube']].map(function (t) { return '<button data-act="tab:' + t[0] + '" aria-current="' + (ui.tab === t[0] ? 'page' : 'false') + '">' + t[1] + '</button>'; }).join('') + '</nav>';
  }
  function viewScript(secs) {
    var t = 0;
    return '<div class="s-pad"><div class="s-actions"><button class="s-cta" data-act="copy-voice">Copy voice script</button><button class="s-btn2" data-act="dl-script">Download script with scene notes (.txt)</button><span class="s-hint">Edit anything below. Your changes are saved in this browser, and marked ‘edited’. Save each of Scotty\u2019s clips with the file name shown on its scene, and the Video tab will match them up automatically.</span></div>' +
      secs.map(function (s, i) {
        var start = t; t += secDur(s);
        return '<section class="s-sec"><div class="s-sechead"><b>' + (i + 1) + '. ' + esc(s.label) + '</b><span class="s-meta" id="meta-' + i + '">' + fmtDur(start) + ' · ' + wordCount(s.text) + ' words · ' + fmtDur(secDur(s)) + '</span>' + (s.edited ? '<span class="s-edited">edited</span><button class="s-link" data-act="reset:' + s.id + '">Reset</button>' : '') + '<span class="s-fname" title="Save Scotty\u2019s audio for this scene with this name">' + slug(i, s.label) + '</span><button class="s-link" data-act="goto:' + i + '">Preview scene</button></div>' +
          '<textarea data-sec="' + s.id + '" data-idx="' + i + '" rows="' + Math.max(3, Math.ceil(s.text.length / 110)) + '">' + esc(s.text) + '</textarea></section>';
      }).join('') + '</div>';
  }
  function stageControls(n, idx, label, dur) {
    return '<div class="s-controls"><button class="s-btn" data-act="prev" aria-label="Previous scene">‹</button><button class="s-cta" data-act="play">' + (ui.playing ? 'Pause' : 'Play') + '</button><button class="s-btn" data-act="next" aria-label="Next scene">›</button>' +
      '<span class="s-meta">Scene ' + (idx + 1) + ' of ' + n + ' · ' + esc(label) + ' · ' + fmtDur(dur) + '</span><span style="flex:1"></span>' +
      '<button class="s-btn2" data-act="clean">Clean mode for recording (H)</button><button class="s-btn2" data-act="fs">Full screen (F)</button></div>';
  }
  function viewVideo(secs) {
    var i = Math.min(ui.scene, secs.length - 1), s = secs[i];
    var total = 0; secs.forEach(function (x, k) { total += sceneDur(k); }); var acc = 0;
    return '<div class="s-pad">' + stageControls(secs.length, i, s.label, sceneDur(i)) +
      '<div class="s-timeline">' + secs.map(function (x, k) { var w = sceneDur(k) / total * 100; acc += w; return '<button style="width:' + w + '%" class="' + (k === i ? 'on' : '') + '" data-act="goto:' + k + '" title="' + esc(x.label) + '"></button>'; }).join('') + '</div>' +
      '<div class="s-stage" id="stage" data-w="1920" data-h="1080"><div class="s-canvas" style="width:1920px;height:1080px">' + scene16(s, sky()) + '</div></div>' +
      '<div class="s-voice"><b>Voiceover for this scene</b><p>' + esc(s.text) + '</p></div>' + voicePanel() + '</div>';
  }
  function viewShorts() {
    var cs = curShort(), n = cs.parts.length, i = Math.min(ui.shortScene, n - 1), p = cs.parts[i], all = cs.parts.map(function (x) { return x.text; }).join(' ');
    var picker = ui.shortMode === 'sign'
      ? SIGNS.map(function (x, k) { return '<button data-act="ssign:' + k + '" aria-pressed="' + (ui.shortSign === k) + '">' + x.glyph + VS + ' ' + x.name + '</button>'; }).join('')
      : '<button data-act="nwhich:0" aria-pressed="' + (ui.numWhich === 0) + '">All 9 (work it out)</button>' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (k) { return '<button data-act="nwhich:' + k + '" aria-pressed="' + (ui.numWhich === k) + '">Month ' + k + '</button>'; }).join('');
    var secs = all.length ? wordCount(all) / st.wpm * 60 : 0;
    return '<div class="s-pad"><div class="s-signs" style="margin-bottom:10px"><button data-act="smode:sign" aria-pressed="' + (ui.shortMode === 'sign') + '">Star sign Shorts</button><button data-act="smode:num" aria-pressed="' + (ui.shortMode === 'num') + '">Numbers Shorts</button></div>' +
      '<div class="s-signs">' + picker + '</div>' +
      (ui.shortMode === 'num' ? '<p class="s-hint" style="margin-top:-6px">Start with the ‘All 9’ Short each month: viewers work out their own number and comment it. Only add the single-number ones if the analytics say they’re pulling views.</p>' : '') +
      '<div class="s-shortwrap"><div><div class="s-stage s-tall" id="stage" data-w="1080" data-h="1920"><div class="s-canvas" style="width:1080px;height:1920px">' + cs.scene(i) + '</div></div></div>' +
      '<div class="s-shortside">' + stageControls(n, i, cs.labels[i], Math.max(4, wordCount(p.text) / st.wpm * 60)) +
      voicePanel() + '<div class="s-dur ' + (secs <= 60 ? 'ok' : 'warn') + '">' + fmtDur(secs) + ' · ' + wordCount(all) + ' words (under 60s is the sweet spot)</div>' +
      cs.parts.map(function (x, k) { return '<section class="s-sec"><div class="s-sechead"><b>' + cs.labels[k] + '</b>' + (x.edited ? '<span class="s-edited">edited</span><button class="s-link" data-act="sreset:' + x.id + '">Reset</button>' : '') + '</div><textarea data-short="' + x.id + '" rows="' + Math.max(2, Math.ceil(x.text.length / 70)) + '">' + esc(x.text) + '</textarea></section>'; }).join('') +
      '<div class="s-actions"><button class="s-cta" data-act="copy-short">Copy this Short\u2019s script</button><button class="s-btn2" data-act="dl-shorts">Download all ' + (ui.shortMode === 'num' ? 'Numbers' : '12 sign') + ' Shorts scripts</button></div>' +
      '<p class="s-hint">These are 9:16, so the same recordings work as Instagram Reels and TikToks.</p></div></div></div>';
  }
  function viewYouTube(secs) {
    var pk = ytPackage(sky(), secs, st.wpm);
    return '<div class="s-pad"><h2>Title ideas</h2>' + pk.titles.map(function (t, i) { return '<div class="s-row"><span>' + esc(t) + '</span><span class="s-meta">' + t.length + '/100</span><button class="s-btn2" data-act="copyt:' + i + '">Copy</button></div>'; }).join('') +
      '<h2>Description</h2><p class="s-hint">Chapter times are estimates at ' + st.wpm + ' wpm. Once you’ve got the real voice track, nudge them to match.</p><textarea id="ytdesc" rows="24">' + esc(pk.desc) + '</textarea><div class="s-actions"><button class="s-cta" data-act="copy-desc">Copy description</button></div></div>';
  }

  function fit() {
    var stg = document.getElementById('stage'); if (!stg) return;
    var cw = +stg.getAttribute('data-w'), ch = +stg.getAttribute('data-h'), cv = stg.firstChild;
    var W = stg.clientWidth, H = ui.clean ? window.innerHeight : (cw > ch ? W * ch / cw : Math.min(window.innerHeight * 0.78, 900));
    if (ui.clean) W = window.innerWidth;
    var sc = (!ui.clean && cw < ch) ? H / ch : Math.min(W / cw, H / ch);
    if (ui.clean) { var dpr = window.devicePixelRatio || 1, step = cw > ch ? 32 : 144, pw = Math.floor(cw * sc * dpr / step) * step; if (pw > 0) sc = pw / dpr / cw; }
    stg.style.height = (ui.clean ? window.innerHeight : ch * sc) + 'px';
    if (!ui.clean && cw < ch) stg.style.width = (cw * sc) + 'px';
    cv.style.transform = 'scale(' + sc + ')';
    cv.style.left = Math.round((!ui.clean && cw < ch) ? 0 : (W - cw * sc) / 2) + 'px'; cv.style.top = Math.round((ui.clean ? window.innerHeight - ch * sc : 0) / 2) + 'px';
  }

  var secsCache = null;
  function render() {
    var secs = secsCache = sections();
    var body = ui.tab === 'script' ? viewScript(secs) : ui.tab === 'video' ? viewVideo(secs) : ui.tab === 'shorts' ? viewShorts() : viewYouTube(secs);
    root.innerHTML = header(secs) + body;
    document.body.classList.toggle('clean', ui.clean);
    fit();
  }
  function schedule() { if (ui.playing) playFrom(curIndex()); }
  function step(dlt) {
    var wasPlaying = ui.playing; stopRun();
    var n = sceneCount(); setIndex(Math.max(0, Math.min(n - 1, curIndex() + dlt)));
    render(); if (wasPlaying) playFrom(curIndex());
  }
  function scriptTxt(secs) {
    var t = 0, out = ['DUOLOGY · ' + sky().label.toUpperCase() + ' FORECAST', 'Estimated ' + fmtDur(secs.reduce(function (a, s) { return a + secDur(s); }, 0)) + ' at ' + st.wpm + ' wpm · ' + secs.reduce(function (a, s) { return a + wordCount(s.text); }, 0) + ' words', ''];
    secs.forEach(function (s, i) { out.push('[SCENE ' + (i + 1) + ' · ' + s.label + ' · starts ' + fmtDur(t) + ' · ' + fmtDur(secDur(s)) + ']'); out.push(s.text); out.push(''); t += secDur(s); });
    return out.join('\n');
  }

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.getAttribute('data-act').split(':'), act = a[0], arg = a[1];
    if (act === 'tab') { stopRun(); ui.recMsg = ''; ui.tab = arg; render(); }
    else if (act === 'mprev' || act === 'mnext') { ui.m += act === 'mnext' ? 1 : -1; if (ui.m > 12) { ui.m = 1; ui.y++; } if (ui.m < 1) { ui.m = 12; ui.y--; } ui.scene = 0; ui.shortScene = 0; render(); }
    else if (act === 'goto') { stopRun(); if (ui.tab !== 'video') ui.tab = 'video'; ui.scene = +arg; render(); }
    else if (act === 'prev') step(-1);
    else if (act === 'next') step(1);
    else if (act === 'play') togglePlay();
    else if (act === 'record') startRecording();
    else if (act === 'clearvoice') clearVoice();
    else if (act === 'clearmusic') clearMusic();
    else if (act === 'clean') { ui.clean = true; render(); }
    else if (act === 'fs') { var s = document.getElementById('stage'); if (s && s.requestFullscreen) { ui.clean = true; render(); document.documentElement.requestFullscreen().catch(function () {}); } }
    else if (act === 'reset') { delete st.edits[mkey() + '|' + arg]; persist(); render(); }
    else if (act === 'sreset') { var cs0 = curShort(); delete cs0.store[cs0.key + '|' + arg]; persist(); render(); }
    else if (act === 'ssign') { stopRun(); ui.shortSign = +arg; ui.shortScene = 0; render(); }
    else if (act === 'smode') { stopRun(); ui.shortMode = arg; ui.shortScene = 0; render(); }
    else if (act === 'nwhich') { stopRun(); ui.numWhich = +arg; ui.shortScene = 0; render(); }
    else if (act === 'copy-voice') copy(secsCache.map(function (s) { return s.text; }).join('\n\n'), el);
    else if (act === 'dl-script') download('duology-' + mkey() + '-script.txt', scriptTxt(secsCache));
    else if (act === 'copy-short') copy(curShort().parts.map(function (p) { return p.text; }).join(' '), el);
    else if (act === 'dl-shorts') {
      var out = [], kk;
      if (ui.shortMode === 'num') {
        var keepN = ui.numWhich;
        for (kk = 0; kk <= 9; kk++) { ui.numWhich = kk; var ns = numShort(), tn = ns.parts.map(function (p) { return p.text; }).join(' '); out.push('=== ' + (kk ? 'PERSONAL MONTH ' + kk : 'ALL NUMBERS (WORK IT OUT)') + ' · ' + fmtDur(wordCount(tn) / st.wpm * 60) + ' ===\n' + tn + '\n'); }
        ui.numWhich = keepN; download('duology-' + mkey() + '-numbers-shorts.txt', out.join('\n'));
      } else {
        var keep = ui.shortSign;
        for (kk = 0; kk < 12; kk++) { ui.shortSign = kk; var sh = short(), tx = sh.parts.map(function (p) { return p.text; }).join(' '); out.push('=== ' + SIGNS[kk].name.toUpperCase() + ' · ' + fmtDur(wordCount(tx) / st.wpm * 60) + ' ===\n' + tx + '\n'); }
        ui.shortSign = keep; download('duology-' + mkey() + '-shorts.txt', out.join('\n'));
      }
    }
    else if (act === 'copyt') copy(ytPackage(sky(), secsCache, st.wpm).titles[+arg], el);
    else if (act === 'copy-desc') copy(document.getElementById('ytdesc').value, el);
  });
  var saveT = null;
  root.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'musicvol') { var lb = document.getElementById('musicvoltxt'); if (lb) lb.textContent = t.value + '%'; st.musicVol = +t.value; if (ui.playing) musicRamp(musicLevel(), 0.2); return; }
    if (t.hasAttribute('data-sec')) {
      var id = t.getAttribute('data-sec'), i = +t.getAttribute('data-idx'), s = secsCache[i];
      s.text = t.value; if (t.value === s.generated) delete st.edits[mkey() + '|' + id]; else st.edits[mkey() + '|' + id] = t.value;
      var m = document.getElementById('meta-' + i); if (m) m.textContent = wordCount(t.value) + ' words · ' + fmtDur(secDur(s));
      var tot = secsCache.reduce(function (a, x) { return a + secDur(x); }, 0), b = document.getElementById('durbadge');
      if (b) { b.textContent = fmtDur(tot) + ' · ' + secsCache.reduce(function (a, x) { return a + wordCount(x.text); }, 0) + ' words'; b.className = 's-dur ' + (tot >= 300 && tot <= 435 ? 'ok' : 'warn'); }
      clearTimeout(saveT); saveT = setTimeout(persist, 400);
    } else if (t.hasAttribute('data-short')) {
      var cs1 = curShort(); cs1.store[cs1.key + '|' + t.getAttribute('data-short')] = t.value;
      clearTimeout(saveT); saveT = setTimeout(persist, 400);
    }
  });
  root.addEventListener('change', function (e) {
    if (e.target.id === 'voicefiles' && e.target.files && e.target.files.length) { loadVoiceFiles(e.target.files); return; }
    if (e.target.id === 'musicfile' && e.target.files && e.target.files[0]) { loadMusic(e.target.files[0]); return; }
    if (e.target.id === 'sting') { st.sting = e.target.checked; persist(); render(); return; }
    if (e.target.id === 'musicvol') { st.musicVol = +e.target.value; persist(); if (ui.playing) musicRamp(musicLevel(), 0.2); render(); return; }
    if (e.target.id === 'depth') { st.depth = e.target.value; persist(); ui.scene = 0; render(); }
    if (e.target.id === 'order') { st.order = e.target.value; persist(); ui.scene = 0; render(); }
    if (e.target.id === 'wpm') { st.wpm = Math.max(100, Math.min(220, +e.target.value || 160)); persist(); render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (recording) { if (e.key === 'Escape') { e.preventDefault(); finishRecording('Stopped early.'); } return; }
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (ui.tab !== 'video' && ui.tab !== 'shorts') return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'h' || e.key === 'H') { ui.clean = !ui.clean; render(); }
    else if (e.key === 'Escape' && ui.clean) { stopRun(); ui.clean = false; if (document.fullscreenElement) document.exitFullscreen(); render(); }
    else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) { ui.clean = true; render(); document.documentElement.requestFullscreen().catch(function () {}); } else document.exitFullscreen(); }
  });
  document.addEventListener('fullscreenchange', function () { if (recording) { fit(); return; } if (!document.fullscreenElement && ui.clean) { stopRun(); ui.clean = false; render(); } else fit(); });
  window.addEventListener('resize', fit);
  render();
})();
// ===== STUDIO APP END =====

</script>
</body>
</html>
