<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duology: astrology and numerology, explained</title>
<meta name="description" content="Your birth chart in plain English, with the why behind every placement. Plus forecasts and numerology.">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duology">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA;--surface:#FFFDF8;--ink:#1D1B26;--ink2:#3E3947;--muted:#5E5869;--line:#DDD6C8;--line2:#BDB4A3;--soft:#EAE4D7;
  --accent:#2E3A8C;--accent-soft:#E6E8F4;--on-accent:#FFFFFF;--rust:#A0521A;--flow:#2E6BC4;--tension:#C2561B;--danger:#B3261E;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14131A;--surface:#1E1C26;--ink:#EEEAF2;--ink2:#D2CCDA;--muted:#A9A3B5;--line:#34313F;--line2:#4A4657;--soft:#282533;
  --accent:#A9B6FF;--accent-soft:#2A2F52;--on-accent:#14131A;--rust:#E4A673;--flow:#6EA8FF;--tension:#F08A4B;--danger:#FF8A80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{position:sticky;top:0;z-index:5;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.2px}
.brand em{font-style:italic;font-weight:500;color:var(--accent)}
.screen-name{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
main{flex:1;padding:18px 20px 110px}
h1{margin:0;font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:600}
h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:600}
.lede{margin:6px 0 0;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.small{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;line-height:1.5;background:var(--soft);padding:12px 14px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.btn{height:52px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;padding:0 18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-ghost{min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:none;font-size:14px;font-weight:600}
.btn-dashed{min-height:48px;border:1px dashed var(--line2);border-radius:12px;background:none;font-size:14px;font-weight:600;color:var(--accent)}
.btn-danger{min-height:48px;border:1px solid var(--danger);border-radius:12px;background:none;font-size:14px;font-weight:700;color:var(--danger)}
.note .link{min-height:0}
.link{background:none;border:none;padding:0;min-height:44px;color:var(--accent);font-weight:700;text-decoration:underline;font-size:14px;text-align:left}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:700}
.input{height:48px;padding:0 14px;font-size:16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);width:100%}
.input[disabled]{opacity:.45}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.results{display:flex;flex-direction:column;gap:6px}
.result{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.result b{font-size:14px}
.chosen{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.err{color:var(--danger);font-size:13px;font-weight:600}
details.manual summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* segmented */
.seg{display:grid;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{height:44px;border:none;border-radius:9px;font-size:14px;font-weight:700;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:none;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* chart */
.wheel{display:flex;justify-content:center}
.wheel svg{width:100%;max-width:360px;height:auto}
.w-bg{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.w-ring{fill:none;stroke:var(--ink);stroke-width:1}
.w-core{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.w-line{stroke:var(--ink);stroke-width:1}
.w-cusp{stroke:var(--ink);stroke-width:.75;stroke-dasharray:2 3}
.w-angle{stroke:var(--ink);stroke-width:2}
.w-sg{fill:var(--accent);font-size:11px}
.w-sn{fill:var(--ink);font-size:7.5px;font-weight:600}
.w-hn{fill:var(--muted);font-size:8px}
.w-pg{fill:var(--ink);font-size:14px}
.w-pn{fill:var(--ink);font-size:7px;font-weight:700}
.w-ax{fill:var(--rust);font-size:9px;font-weight:700}
.w-planet{cursor:pointer}
.w-planet:hover .w-pg,.w-planet:focus .w-pg{fill:var(--accent)}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.row-btn{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.orb{width:40px;height:40px;flex-shrink:0;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.orb.pt{font-size:13px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;min-height:60px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left}
.tile b{font-size:14px}
.tile .g{color:var(--accent)}
.asp{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;min-height:48px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.asp b{font-size:14px;font-weight:600}
.asp span{font-size:13px;font-weight:600;text-align:right}
.bal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bal div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.bal b{display:block;font-family:var(--serif);font-size:22px}
.bal small{font-size:11.5px;color:var(--muted)}
/* signs */
.signgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.signgrid button{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:600}
.signgrid .sg{font-size:17px;color:var(--accent)}
.signgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.signgrid button[aria-pressed="true"] .sg{color:var(--on-accent)}
/* forecast */
.dark-strip{padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg)}
.dark-strip .k{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.dark-strip .v{font-size:15px;font-weight:600}
.dark-strip .s{font-size:12.5px;opacity:.85}
.month{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:6px}
details.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.ev summary{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
details.ev summary::-webkit-details-marker{display:none}
.date{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.date .m{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.date .d{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.ev-body{flex:1;display:flex;flex-direction:column;gap:3px}
.tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.tag.Planets{color:var(--accent)}.tag.Moon{color:var(--flow)}.tag.Numbers{color:var(--rust)}
.ev-title{font-size:15px;font-weight:700;line-height:1.3}
.ev-read{font-size:13px;color:var(--ink2)}
.plus{font-size:18px;color:var(--muted);line-height:1}
details[open] .plus{transform:rotate(45deg)}
.why{margin:0 14px 14px 72px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.why b{color:var(--rust);font-size:12px;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:2px}
/* numbers */
.num{padding:16px;display:flex;flex-direction:column;gap:10px}
.num-head{display:flex;align-items:center;gap:14px}
.big{width:56px;height:56px;flex-shrink:0;border-radius:28px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;font-weight:600}
.num .k{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.num .m{font-size:15px;font-weight:700;line-height:1.3}
.work{font-size:12.5px;line-height:1.55;color:var(--ink2);background:var(--bg);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums;white-space:pre-line;overflow-wrap:anywhere}
/* learn */
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.lesson summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;min-height:56px;cursor:pointer;font-weight:700}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson .n{font-family:var(--serif);color:var(--rust);width:22px}
details.lesson .body{padding:0 16px 16px 48px;font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-line}
/* settings */
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:10px 14px;border-radius:10px;text-align:left;background:var(--surface);border:1px solid var(--line);width:100%}
.opt[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.opt[disabled]{opacity:.6;cursor:not-allowed}
.opt b{font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.prof{display:flex;align-items:center;gap:12px;padding:12px 14px}
.avatar{width:40px;height:40px;flex-shrink:0;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.switch{width:52px;height:32px;flex-shrink:0;border-radius:16px;border:none;padding:3px;display:flex;background:var(--line2)}
.switch[aria-checked="true"]{background:var(--accent);justify-content:flex-end}
.switch i{width:26px;height:26px;border-radius:13px;background:#fff;display:block}
/* tabs */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;min-height:52px;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:24px;height:24px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,9,14,.55);display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 22px 32px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-title{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1}
.x{width:44px;height:44px;flex-shrink:0;border-radius:22px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.sec-k{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.sec-k.a{color:var(--accent)}.sec-k.r{color:var(--rust)}.sec-k.m{color:var(--muted)}
.whybox{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:14px;font-size:14px}
.housebox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
/* Report */
.report{display:flex;flex-direction:column;gap:14px}
.report .r-head{padding:20px;border-radius:14px;background:var(--ink);color:var(--bg)}
.report .r-head .k{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.report .r-head h1{color:var(--bg);margin:6px 0 4px;font-size:27px;line-height:1.15}
.report .r-head .m{font-size:13px;opacity:.85}
.report h2{margin:12px 0 0}
.report p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink)}
.report .r-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.r-entry{padding:16px;display:flex;flex-direction:column;gap:8px}
.print-only{display:none}
.r-cta{border:1.5px solid #2E3A8C;border-radius:10px;padding:12px 14px;font-size:11pt;line-height:1.5;margin-top:10px;break-inside:avoid}
.r-entry b.t{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.2}
@media print{
  @page{margin:16mm 16mm 20mm;
    @bottom-left{content:"Duology \00B7  Get your own reading at scvd-app.github.io/duology";font-family:'Instrument Sans',Arial,sans-serif;font-size:8.5pt;color:#5E5869}
    @bottom-right{content:counter(page) " / " counter(pages);font-family:'Instrument Sans',Arial,sans-serif;font-size:8.5pt;color:#5E5869}}
  .r-pfoot{display:none!important}
  .print-only{display:block!important}
  .r-foot{display:none!important}
  .r-letter{margin-bottom:4mm}
  :root{--bg:#fff;--surface:#fff;--ink:#1D1B26;--ink2:#3E3947;--muted:#5E5869}
  body{background:#fff!important}
  header.top,nav.tabs,.no-print,.scrim,.pro-card{display:none!important}
  .app{max-width:none;border:none!important}
  main{padding:0!important}
  .report .r-head{background:#fff!important;color:#1D1B26!important;border:none;border-bottom:1px solid #BDB4A3;border-radius:0;padding:0 0 4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .report .r-head h1{color:#1D1B26!important}
  .report .r-head .k{display:none}
  .report h2{break-after:avoid;color:#2E3A8C}
  .report p{font-size:11.5pt;line-height:1.55;orphans:3;widows:3}
}
/* Pro */
.pro-badge{margin-left:8px;vertical-align:4px;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border:none;border-radius:8px;padding:3px 8px;min-height:0}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--rust);vertical-align:middle}
.lock svg{width:12px;height:12px}
.tile.locked,.asp.locked{opacity:.78}
.pro-card{padding:16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--accent);background:var(--accent-soft)}
.pro-card b.t{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.15}
.locked-row{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.locked-row .big{width:44px;height:44px;font-size:21px}
.plans{display:flex;flex-direction:column;gap:8px}
.plan{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:12px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);text-align:left;width:100%}
.plan b{display:block;font-size:15.5px}
.plan .small{display:block}
.plan .price{font-family:var(--serif);font-size:21px;font-weight:600;white-space:nowrap}
.plan.best{border:2px solid var(--accent);background:var(--accent-soft)}
.plan .badge{position:absolute;top:-9px;left:14px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:8px}
.plan[disabled]{opacity:.55}
.perks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.perks li{display:flex;gap:8px;align-items:flex-start}
.perks li:before{content:"\2713";color:var(--accent);font-weight:700}
.codebox{font-family:Consolas,'SF Mono',Menlo,monospace;font-size:13px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;overflow-wrap:anywhere}
.inrow{display:flex;gap:8px}
.inrow .input{flex:1;min-width:0}
.inrow .btn-ghost{flex-shrink:0;min-height:48px}
.ok{color:var(--flow);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ===== ENGINE START =====
// Astronomy engine: no dependencies. Accuracy is roughly 1-2 arcminutes for the
// planets (JPL approximate Keplerian elements, valid 1800-2050) and a few
// arcminutes for the Moon (truncated Meeus series). Plenty for sign/house/aspect work.
var Astro = (function () {
  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  function norm(x) { x = x % 360; return x < 0 ? x + 360 : x; }
  function sind(x) { return Math.sin(x * D2R); }
  function cosd(x) { return Math.cos(x * D2R); }
  function tand(x) { return Math.tan(x * D2R); }
  function atan2d(y, x) { return Math.atan2(y, x) * R2D; }
  function asind(x) { return Math.asin(Math.max(-1, Math.min(1, x))) * R2D; }

  function jdFromMs(ms) { return ms / 86400000 + 2440587.5; }
  function msFromJd(jd) { return (jd - 2440587.5) * 86400000; }

  // [a, e, I, L, longPeri, longNode] and their rates per Julian century

      case 'learn': ui.lesson = arg; go('learn'); break;
      case 'add-profile':
        if (!isPro() && store.profiles.length >= 1) { openPaywall('profiles'); break; }
        if (store.profiles.length >= MAX_PROFILES) { toast('That\u2019s the limit of ' + MAX_PROFILES + ' charts. Delete one to add another.'); break; }
        ui.editId = null; ui.place = null; go('onboard'); break;
      case 'edit-profile':
        var ep = store.profiles.filter(function (x) { return x.id === arg; })[0];
        ui.editId = arg; ui.place = ep && !ep.manual ? { label: ep.placeName, lat: ep.lat, lon: ep.lon, tz: ep.tz } : null; go('onboard'); break;
      case 'use-profile': store.activeId = arg; save(); ui.showAllAsp = false; go('chart'); break;
      case 'del-profile':
        if (ui.confirmDel !== arg) { ui.confirmDel = arg; render(); break; }
        store.profiles = store.profiles.filter(function (x) { return x.id !== arg; });
        if (store.activeId === arg) store.activeId = store.profiles.length ? store.profiles[0].id : null;
        ui.confirmDel = null; save(); render(); break;
      case 'wipe':
        if (!ui.confirmWipe) { ui.confirmWipe = true; render(); break; }
        try { localStorage.removeItem(KEY); } catch (err) {}
        store = JSON.parse(JSON.stringify(DEFAULT_STORE)); ui.confirmWipe = false; go('onboard'); break;
      case 'pick-place':
        var r = ui.results[+arg]; if (!r) break;
        var keep = readForm();
        ui.place = { label: [r.name, r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude, tz: r.timezone };
        ui.results = []; render();
        document.getElementById('f-name').value = keep.name; document.getElementById('f-date').value = keep.date;
        document.getElementById('f-notime').checked = keep.noTime; document.getElementById('f-time').value = keep.time;
        document.getElementById('f-time').disabled = keep.noTime; document.getElementById('notime-note').hidden = !keep.noTime;
        break;
      case 'clear-place':
        var kp = readForm(); ui.place = null; render();
        document.getElementById('f-name').value = kp.name; document.getElementById('f-date').value = kp.date;
        document.getElementById('f-notime').checked = kp.noTime; document.getElementById('f-time').value = kp.time;
        document.getElementById('f-time').disabled = kp.noTime; document.getElementById('notime-note').hidden = !kp.noTime;
        document.getElementById('f-place').focus();
        break;
      case 'save-profile': saveProfile(); break;
      case 'sign': ui.sign = +arg; try { history.replaceState(null, '', '#sign=' + SIGNS[+arg].name.toLowerCase()); } catch (err) {} render(); break;
      case 'smonth': ui.smonth = +arg; render(); break;
    }
  });
  root.addEventListener('keydown', function (e) {
    var el = e.target.closest && e.target.closest('g[data-act]');
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  root.addEventListener('change', function (e) {
    if (e.target.id === 'f-bday' && e.target.value) {
      var bp = e.target.value.split('-').map(Number);
      var sl = Astro.positions(Astro.jdFromMs(Date.UTC(bp[0], bp[1] - 1, bp[2], 12))).sun, dd = sl % 30;
      ui.sign = signOf(sl);
      ui.cusp = dd < 1.2 ? [(ui.sign + 11) % 12, ui.sign] : dd > 28.8 ? [ui.sign, (ui.sign + 1) % 12] : null;
      render(); return;
    }
    if (e.target.id === 'f-switch') { store.activeId = e.target.value; save(); ui.showAllAsp = false; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (ui.claim && ui.claim.state !== 'working') { ui.claim = null; render(); }
    else if (ui.paywall && !ui.payBusy) { ui.paywall = null; render(); }
    else if (ui.card) { ui.card = null; render(); }
  });
  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.id) return;
    if (e.target.id.indexOf('f-code-') === 0) { e.preventDefault(); applyCode(e.target.id.slice(7)); }
    if (e.target.id === 'f-restore') { e.preventDefault(); restore(); }
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted && ui.payBusy) { ui.payBusy = null; render(); } });

  // ---------- returning from Stripe, and keeping Pro honest ----------
  (function () {
    var q = new URLSearchParams(location.search), paid = q.get('paid'), pending = null;
    try { pending = localStorage.getItem(PENDING_KEY); } catch (e) {}
    if (paid || q.get('payment')) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
    if (q.get('payment') === 'cancelled') ui.payNote = 'Checkout cancelled. Nothing was charged.';
    if (paid && /^cs_(test|live)_[A-Za-z0-9]+$/.test(paid)) {
      try { localStorage.setItem(PENDING_KEY, paid); } catch (e) {}
      claim(paid, 0); return;
    }
    if (pending && !isPro()) { claim(pending, 4); return; }
    if (pro && apiReady() && Date.now() - (pro.checkedAt || 0) > 3 * 86400000) {
      api('/verify-token', { token: pro.token }).then(function (r) {
        if (r.status !== 200) return;
        if (r.d.valid) { pro.checkedAt = Date.now(); savePro(); }
        else if (r.d.reason && !/run out/.test(r.d.reason)) { ui.proLost = 'Pro was removed from this device: ' + r.d.reason; pro = null; savePro(); chartCache = {}; fcCache = {}; render(); }
      }).catch(function () {});
    }
  })();

  render();
})();
// ===== APP END =====

</script>
</body>
</html>
