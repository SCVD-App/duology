<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Click check · Duology</title>
<meta name="description" content="Do you two click? Check how your stars and numbers line up, with a friend, partner, family member or workmate.">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14131A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA;--surface:#FFFDF8;--ink:#1D1B26;--ink2:#3E3947;--muted:#5E5869;--line:#DDD6C8;--line2:#BDB4A3;--soft:#EAE4D7;
  --accent:#2E3A8C;--accent-soft:#E6E8F4;--on-accent:#FFFFFF;--rust:#A0521A;--flow:#2E6BC4;--tension:#C2561B;--danger:#B3261E;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14131A;--surface:#1E1C26;--ink:#EEEAF2;--ink2:#D2CCDA;--muted:#A9A3B5;--line:#34313F;--line2:#4A4657;--soft:#282533;
  --accent:#A9B6FF;--accent-soft:#2A2F52;--on-accent:#14131A;--rust:#E4A673;--flow:#6EA8FF;--tension:#F08A4B;--danger:#FF8A80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.2px;color:var(--ink);text-decoration:none}
.brand em{font-style:italic;font-weight:500;color:var(--accent)}
.screen-name{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
main{flex:1;padding:20px 20px 60px}
h1{margin:0;font-family:var(--serif);font-size:32px;line-height:1.08;font-weight:600}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:600}
h3{margin:0;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--rust)}
.lede{margin:8px 0 0;color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.small{font-size:12.5px;color:var(--muted)}
.note{font-size:13px;line-height:1.5;background:var(--soft);padding:12px 14px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.btn{height:52px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;padding:0 18px;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-ghost{min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:none;font-size:14px;font-weight:600;width:100%}
.link{background:none;border:none;padding:0;min-height:44px;color:var(--accent);font-weight:700;text-decoration:underline;font-size:14px;text-align:left}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.input{height:48px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{min-height:44px;border:1px solid var(--line2);border-radius:22px;background:none;font-size:14px;font-weight:600;padding:0 6px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;font-weight:600}
.who{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.who h2{font-size:18px}
.badge{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.hero{text-align:left;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.hero .names{font-family:var(--serif);font-size:32px;line-height:1.1;font-weight:600}
.hero .names em{font-style:italic;font-weight:500;color:var(--accent)}
.hero .hl{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.2;color:var(--accent)}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13.5px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.chip b{font-weight:700}
.item{border-left:4px solid var(--line2);padding:4px 0 4px 12px}
.item.click{border-color:var(--flow)}
.item.spark{border-color:var(--tension)}
.item b{display:block;font-size:14px}
.item p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.cv{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;background:#14131A}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.copybox{width:100%;font-size:12px;word-break:break-all;background:var(--soft);border-radius:8px;padding:10px;border:none;color:var(--ink2);min-height:70px;resize:none}
.sr{position:absolute;left:-9999px}
</style>

<script>

/* ---------- share card (drawn on a canvas, so no server is involved) ---------- */
function wrapLines(g, text, maxW) { var w = text.split(/\s+/), lines = [], cur = ''; w.forEach(function (x) { var t = cur ? cur + ' ' + x : x; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = x; } else cur = t; }); if (cur) lines.push(cur); return lines; }
function drawCard(g, W, H, r) {
  var u = W / 1080, T = TYPES[r.type], tall = H > 1500, top = tall ? 250 : 120, bottom = tall ? 340 : 70;
  var bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#14131A'); bg.addColorStop(1, '#1B1A25'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  var rg = g.createRadialGradient(W * 0.85, H * 0.12, 10, W * 0.85, H * 0.12, W * 0.8); rg.addColorStop(0, 'rgba(169,182,255,.16)'); rg.addColorStop(1, 'rgba(169,182,255,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  var rg2 = g.createRadialGradient(W * 0.1, H * 0.95, 10, W * 0.1, H * 0.95, W * 0.9); rg2.addColorStop(0, 'rgba(228,166,115,.12)'); rg2.addColorStop(1, 'rgba(228,166,115,0)'); g.fillStyle = rg2; g.fillRect(0, 0, W, H);
  var x = 90 * u, maxW = W - 180 * u, y = top * u;
  g.textBaseline = 'alphabetic';
  /* kicker */
  g.font = '700 ' + 26 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#E4A673';
  var k = ('CLICK CHECK · ' + T.plural).toUpperCase(), kx = x; for (var i = 0; i < k.length; i++) { g.fillText(k[i], kx, y); kx += g.measureText(k[i]).width + 5 * u; }
  y += 40 * u;
  /* names, shrunk to fit */
  var na = r.a.name, nb = r.b.name, size = 120 * u, line;
  do { g.font = '600 ' + size + 'px Fraunces,Georgia,serif'; var wA = g.measureText(na).width, wAmp = g.measureText(' & ').width; line = wA + wAmp + g.measureText(nb).width; size -= 4 * u; } while (line > maxW && size > 44 * u);
  size += 4 * u; g.font = '600 ' + size + 'px Fraunces,Georgia,serif';
  y += size * 0.9; g.fillStyle = '#EEEAF2'; g.fillText(na, x, y); var cx = x + g.measureText(na).width;
  g.font = 'italic 500 ' + size + 'px Fraunces,Georgia,serif'; g.fillStyle = '#A9B6FF'; g.fillText(' & ', cx, y); cx += g.measureText(' & ').width;
  g.font = '600 ' + size + 'px Fraunces,Georgia,serif'; g.fillStyle = '#EEEAF2'; g.fillText(nb, cx, y);
  y += 70 * u;
  /* headline */
  g.font = 'italic 500 ' + 66 * u + 'px Fraunces,Georgia,serif'; g.fillStyle = '#A9B6FF';
  wrapLines(g, r.headline, maxW).forEach(function (l) { g.fillText(l, x, y); y += 78 * u; });
  y += 6 * u;
  /* summary */
  g.font = '400 ' + 34 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#B3ADBF';
  wrapLines(g, r.summary, maxW).slice(0, 4).forEach(function (l) { g.fillText(l, x, y); y += 48 * u; });
  y += 34 * u;
  /* two chips, one per person */
  [r.a, r.b].forEach(function (p) {
    var label = p.name, rest = nameOfSign(p.sun) + ' Sun  ·  Life Path ' + p.lp + '  ·  ' + p.cz.animal;
    g.font = '700 ' + 30 * u + 'px "Instrument Sans",system-ui,sans-serif'; var w1 = g.measureText(label).width;
    g.font = '500 ' + 30 * u + 'px "Instrument Sans",system-ui,sans-serif'; var w2 = g.measureText('   ' + rest).width, bw = Math.min(maxW, w1 + w2 + 56 * u), bh = 70 * u;
    g.fillStyle = 'rgba(255,255,255,.04)'; rr(g, x, y - 46 * u, bw, bh, bh / 2); g.fill(); g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 2 * u; rr(g, x, y - 46 * u, bw, bh, bh / 2); g.stroke();
    g.font = '700 ' + 30 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#A9B6FF'; g.fillText(label, x + 28 * u, y);
    g.font = '500 ' + 30 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#EEEAF2'; g.fillText('   ' + rest, x + 28 * u + w1, y);
    y += 88 * u;
  });
  /* top clicks and sparks, titles only */
  [['WHERE YOU CLICK', r.clicks, '#6EA8FF'], ['WHERE YOU SPARK', r.sparks, '#F08A4B']].forEach(function (sec) {
    if (!sec[1].length) return; y += 10 * u;
    g.font = '700 ' + 24 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = sec[2]; g.fillText(sec[0], x, y); y += 46 * u;
    sec[1].slice(0, tall ? 4 : 2).forEach(function (it) { g.font = '600 ' + 36 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#EEEAF2'; g.fillText('•  ' + it.t, x, y); y += 52 * u; });
    y += 14 * u;
  });
  /* footer */
  var fy = H - bottom * u;
  g.font = '600 ' + 54 * u + 'px Fraunces,Georgia,serif'; g.fillStyle = '#EEEAF2'; g.fillText('Du', x, fy); var dw = g.measureText('Du').width;
  g.font = 'italic 500 ' + 54 * u + 'px Fraunces,Georgia,serif'; g.fillStyle = '#A9B6FF'; g.fillText('ology', x + dw, fy);
  g.font = '400 ' + 26 * u + 'px "Instrument Sans",system-ui,sans-serif'; g.fillStyle = '#B3ADBF'; g.fillText('Do you two click? scvd.app/duology', x, fy + 38 * u);
  g.textAlign = 'right'; g.fillText('For reflection and fun', W - 90 * u, fy + 38 * u); g.textAlign = 'left';
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function paintPreview() {
  var cv = $('#cv'); if (!cv || !st.res) return;
  var W = 1080, H = st.fmt === '9x16' ? 1920 : 1350, pw = 540; cv.width = pw; cv.height = Math.round(pw * H / W);
  var g = cv.getContext('2d'); g.setTransform(pw / W, 0, 0, pw / W, 0, 0); drawCard(g, W, H, st.res);
}
function cardBlob(cb) {
  var W = 1080, H = st.fmt === '9x16' ? 1920 : 1350, c = document.createElement('canvas'); c.width = W; c.height = H; drawCard(c.getContext('2d'), W, H, st.res); c.toBlob(cb, 'image/png');
}
function fontsThen(fn) { if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('600 40px Fraunces'), document.fonts.load('italic 500 40px Fraunces'), document.fonts.load('400 20px "Instrument Sans"'), document.fonts.load('700 20px "Instrument Sans"')]).then(fn, fn); else fn(); }

/* ---------- wiring ---------- */
function render() {
  var m = $('#main');
  m.innerHTML = st.screen === 'result' ? screenResult() : (st.screen === 'recv' ? screenRecv() : screenMake());
  if (st.screen === 'result') fontsThen(paintPreview);
}
function readFields() {
  var v = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
  if (document.getElementById('y-name')) { st.you.name = v('y-name'); st.you.date = v('y-date'); if (document.getElementById('y-full')) st.you.full = v('y-full'); }
  if (document.getElementById('t-name')) { st.them.name = v('t-name'); st.them.date = v('t-date'); st.them.full = v('t-full'); }
}
function finish(Aname, Adate, Afull, Bname, Bdate, Bfull, type) {
  st.res = analyse(person(Aname, Adate, Afull), person(Bname, Bdate, Bfull), type); st.screen = 'result'; st.link = ''; st.err = ''; track('pair'); render(); window.scrollTo(0, 0);
}
$('#main').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return; var a = b.getAttribute('data-act'), arg = a.split(':')[1]; a = a.split(':')[0];
  readFields();
  if (a === 'type') { st.type = arg; render(); }
  else if (a === 'go') {
    var yn = cleanName(st.you.name), tn = cleanName(st.them.name);
    if (!firstOf(yn) || !firstOf(tn)) { st.err = 'Add a first name for each of you.'; render(); return; }
    if (!validDate(st.you.date) || !validDate(st.them.date)) { st.err = 'Add both birth dates (the calculations cover 1800 to 2050).'; render(); return; }
    finish(firstOf(yn), st.you.date, cleanName(st.you.full), firstOf(tn), st.them.date, cleanName(st.them.full), st.type);
  }
  else if (a === 'gorecv') {
    var n = firstOf(cleanName(st.you.name)); if (!n) { st.err = 'Add your first name.'; render(); return; } if (!validDate(st.you.date)) { st.err = 'Add your birth date (the calculations cover 1800 to 2050).'; render(); return; }
    finish(st.from.name, st.from.date, '', n, st.you.date, '', st.from.type);
  }
  else if (a === 'notme') { st.from = null; st.screen = 'make'; try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} render(); }
  else if (a === 'fmt') { st.fmt = arg; render(); }
  else if (a === 'again') { st.them = { name: '', date: '', full: '' }; st.from = null; st.screen = 'make'; try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} render(); window.scrollTo(0, 0); }
  else if (a === 'link') {
    var base = location.href.split('#')[0].split('?')[0];
    st.link = base + '?ref=cc#c=' + b64e({ v: 1, n: st.res.a.name, d: st.res.a.date, t: st.res.type }); track('pshare'); render();
    var lk = document.getElementById('lk'); if (lk) lk.scrollIntoView({ block: 'center' });
  }

      else { var u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); }

})();
